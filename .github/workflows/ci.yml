name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Only a newer push to the same PR makes a run pointless. On main every
  # commit is kept: two quick merges once let the older commit's run cancel
  # the newer one, leaving main's head untested.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Public values: the project id is in every image URL on the site. The
      # dataset is read through the public CDN, so no token is needed.
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID || 'qv75bufa' }}
      NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET || 'production' }}
      NEXT_TELEMETRY_DISABLED: 1
      # Not a real key. It only makes the build render the photo check button,
      # so tests/photo-check.spec.ts can drive it; that spec intercepts
      # /api/photo-check, so no model is ever called from CI.
      ANTHROPIC_API_KEY: ci-placeholder-not-a-key
      # A throwaway value so the signed-webhook test runs; the real one lives in Vercel.
      SANITY_REVALIDATE_SECRET: ci-only-webhook-secret
      # Content comes from tests/fixtures/sanity.json (npm run fixtures:export),
      # not live Sanity, so a slow or empty Sanity response can't fail CI.
      SANITY_FIXTURES: tests/fixtures/sanity.json
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Lint
        run: npx next lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright
        run: npx playwright test

      - name: Upload report and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 14
